name: Backend tests

# Runs every backend test on each push to main (as the course requires), and on pull requests
# into main and develop so problems show up before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The no-mock tests that call Google Places run only when this secret is set.
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache MongoDB binary for the no-mock tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Interface tests (mock, no-mock, combined)
        run: bash ../scripts/run-backend-interface-tests.sh

      - name: Non-functional requirement tests
        run: bash ../scripts/run-backend-nfr-tests.sh

      - name: Unit tests
        run: npm test -- tests/unit/ --coverageDirectory=coverage/unit

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
